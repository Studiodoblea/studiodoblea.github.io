<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Brasa Burger App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile app shell (max 480px), sticky header, chip rail, product grid, bottom sheets for detail + cart */
:root{
  --bg:#FFF6E0; --surface:#FFFFFF; --soft:#FCE9BE; --ink:#221A14; --muted:#7A6A5A;
  --ketchup:#D7261E; --mustard:#FFC21A; --lettuce:#3E9B3A; --line:#EBD9B4; --shadow:0 6px 18px rgba(80,40,0,.10);
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17120E; --surface:#231B15; --soft:#2F241B; --ink:#FFF0DA; --muted:#BCA88F;
  --ketchup:#F0463C; --mustard:#FFC93A; --lettuce:#5CC257; --line:#3A2D22; --shadow:0 6px 18px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120E; --surface:#231B15; --soft:#2F241B; --ink:#FFF0DA; --muted:#BCA88F;
  --ketchup:#F0463C; --mustard:#FFC93A; --lettuce:#5CC257; --line:#3A2D22; --shadow:0 6px 18px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:40px;height:40px;border-radius:12px;background:var(--ketchup);display:grid;place-items:center}
.logo b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1}
.logo small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.open{font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:99px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.open i{width:8px;height:8px;border-radius:50%;background:var(--lettuce)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px;margin-top:4px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);height:100%}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--mustard)}
.hero{margin-top:16px;border-radius:22px;background:var(--ketchup);color:#FFF6E0;padding:20px;display:grid;grid-template-columns:1fr 128px;gap:8px;align-items:center;overflow:hidden;position:relative}
.hero .tag{display:inline-block;background:var(--mustard);color:#221A14;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.hero h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:.95;letter-spacing:-.03em;margin:10px 0 6px;text-wrap:balance}
.hero p{margin:0 0 14px;font-size:13px;opacity:.9}
.hero button{background:#FFF6E0;color:#221A14;font-weight:700;padding:10px 16px;border-radius:99px}
.hero svg{width:100%;height:auto;transform:rotate(-8deg) scale(1.15)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:2px max(16px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;margin:22px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border-radius:18px;padding:10px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .15s}
.card:active{transform:scale(.97)}
.card .pic{background:var(--soft);border-radius:13px;aspect-ratio:6/5;display:grid;place-items:center;max-width:100%}
.card .pic svg{width:78%;height:auto}
.card .name{font-weight:700;font-size:15px;line-height:1.2;min-height:2.4em}
.card .row{display:flex;justify-content:space-between;align-items:center}
.card .price{font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.card .plus{width:32px;height:32px;border-radius:10px;background:var(--mustard);color:#221A14;display:grid;place-items:center;font-weight:800;font-size:20px;line-height:1}
.badge{align-self:flex-start;font-size:11px;font-weight:700;color:var(--ketchup);text-transform:uppercase;letter-spacing:.06em}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.cartbar button{pointer-events:auto;max-width:448px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:18px;padding:14px 18px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cartbar .count{background:var(--mustard);color:#221A14;border-radius:8px;padding:2px 8px;margin-right:8px;font-variant-numeric:tabular-nums}
.cartbar .tot{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,10,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.d-pic{background:var(--soft);border-radius:20px;display:grid;place-items:center;padding:18px;position:relative}
.d-pic svg{width:62%;max-width:240px;height:auto}
.close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:var(--surface);font-size:20px;line-height:1}
.d-title{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:16px 0 4px;text-wrap:balance}
.d-desc{color:var(--muted);margin:0 0 6px;line-height:1.5}
.kcal{font-size:12px;color:var(--muted);font-weight:600}
.group{margin-top:18px}
.group h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600;text-align:left}
.opt[aria-checked="true"]{border-color:var(--ketchup)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[role="checkbox"] .dot{border-radius:6px}
.opt[aria-checked="true"] .dot{border-color:var(--ketchup);background:var(--ketchup)}
.opt[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:2px;background:#fff}
.opt .l{display:flex;align-items:center;gap:10px}
.opt .p{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
textarea,.field input{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical}
.foot{display:flex;gap:12px;align-items:center;margin-top:20px}
.qty{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.qty button{width:42px;height:48px;font-size:22px;font-weight:700}
.qty span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cta{flex:1;background:var(--ketchup);color:#fff;font-weight:700;border-radius:14px;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px}
.cta b{font-family:var(--display);font-variant-numeric:tabular-nums}
.cta.wa{background:#1F9D55}
.cta:disabled{opacity:.5;cursor:not-allowed}
.c-title{font-family:var(--display);font-weight:800;font-size:24px;margin:4px 0 12px}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .mini{background:var(--soft);border-radius:12px;aspect-ratio:1;display:grid;place-items:center}
.line .mini svg{width:80%}
.line .n{font-weight:700;min-width:0}
.line .n small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.line .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.line .r b{font-variant-numeric:tabular-nums}
.line .qty button{width:30px;height:30px;font-size:17px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:10px;border-radius:10px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.sum{margin-top:16px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;color:var(--muted)}
.sum .t{color:var(--ink);font-weight:800;font-size:18px;font-family:var(--display)}
.preview{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;white-space:pre-wrap;color:var(--muted);max-height:160px;overflow:auto}
.ghost{margin-top:10px;width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);font-weight:600}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:40;font-size:14px;white-space:nowrap}
.demo{font-size:11px;color:var(--muted);text-align:center;margin-top:26px}

.card .pic,.d-pic,.line .mini{overflow:hidden;padding:0;background:#FCE9BE}
.card .pic img,.line .mini img{width:100%;height:100%;object-fit:cover;display:block}
.d-pic img{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}

/* ---------- ilustraciones SVG ---------- */
function art(kind){
  const bunTop = `<path d="M16 50c0-22 20-34 44-34s44 12 44 34z" fill="#E59A3B"/><g fill="#FFE3A8"><ellipse cx="44" cy="30" rx="3" ry="1.6"/><ellipse cx="62" cy="25" rx="3" ry="1.6"/><ellipse cx="78" cy="33" rx="3" ry="1.6"/><ellipse cx="54" cy="38" rx="3" ry="1.6"/></g>`;
  const lettuce = y=>`<path d="M14 ${y}q6 6 12 0t12 0 12 0 12 0 12 0 12 0 12 0 12 0v6H14z" fill="#5DB84F"/>`;
  const cheese = y=>`<path d="M16 ${y}h88l-10 9-8-6-10 8-10-7-12 9-10-8-10 7-8-7z" fill="#FFC21A"/>`;
  const patty = y=>`<rect x="15" y="${y}" width="90" height="12" rx="6" fill="#6B3A22"/>`;
  const bunBot = y=>`<path d="M18 ${y}h84v4a10 10 0 0 1-10 10H28a10 10 0 0 1-10-10z" fill="#D9862C"/>`;
  const S = inner => `<svg viewBox="0 0 120 100" aria-hidden="true">${inner}</svg>`;
  switch(kind){
    case "burger": return S(lettuce(50)+bunTop+cheese(56)+patty(60)+bunBot(74));
    case "double": return S(bunTop+lettuce(50)+cheese(55)+patty(58)+cheese(68)+patty(71)+bunBot(84));
    case "chicken": return S(bunTop+lettuce(50)+`<path d="M13 57q47-8 94 0l-3 15q-44 6-88 0z" fill="#E7A94A"/><g fill="#C9832C"><circle cx="30" cy="63" r="2"/><circle cx="52" cy="61" r="2"/><circle cx="74" cy="64" r="2"/><circle cx="92" cy="61" r="2"/></g>`+bunBot(74));
    case "veggie": return S(bunTop+lettuce(50)+`<rect x="18" y="56" width="84" height="6" rx="3" fill="#E5463C"/><rect x="16" y="62" width="88" height="11" rx="5.5" fill="#8C9B3C"/>`+bunBot(74));
    case "fries": return S(`<g fill="#FFC93A">${[30,40,50,60,70,80,90].map((x,i)=>`<rect x="${x-3}" y="${10+(i%3)*6}" width="7" height="50" rx="2" transform="rotate(${(i-3)*5} ${x} 60)"/>`).join("")}</g><path d="M26 44h68l-8 50H34z" fill="#D7261E"/><path d="M42 62q18 10 36 0" stroke="#FFF6E0" stroke-width="4" fill="none" stroke-linecap="round"/>`);
    case "loaded": return S(`<path d="M18 46h84l-10 44H28z" fill="#D7261E"/>${[26,36,46,56,66,76,86].map((x,i)=>`<rect x="${x}" y="${30+(i%2)*6}" width="8" height="22" rx="2" fill="#FFC93A" transform="rotate(${(i-3)*7} ${x} 46)"/>`).join("")}<path d="M22 44q10-8 20 0t20 0 20 0 18 0v6H22z" fill="#FF9F1A"/><g fill="#8B2E1C"><rect x="34" y="38" width="9" height="4" rx="2"/><rect x="62" y="36" width="9" height="4" rx="2"/><rect x="80" y="40" width="9" height="4" rx="2"/></g>`);
    case "nuggets": return S(`<ellipse cx="60" cy="80" rx="46" ry="10" fill="#F2D9A6"/>${[[38,62],[60,58],[82,64],[48,74],[72,76]].map(([x,y],i)=>`<path d="M${x-13} ${y}q2-12 14-11t12 11q-3 10-14 9t-12-9z" fill="${i%2?'#E3A043':'#D48E35'}"/>`).join("")}<ellipse cx="96" cy="78" rx="10" ry="5" fill="#D7261E"/>`);
    case "rings": return S([[40,60],[66,52],[84,70],[56,74]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="17" fill="none" stroke="#E3A043" stroke-width="10"/><circle cx="${x}" cy="${y}" r="17" fill="none" stroke="#C9832C" stroke-width="2" stroke-dasharray="3 5"/>`).join(""));
    case "soda": return S(`<rect x="62" y="4" width="6" height="30" rx="3" fill="#FFF6E0" transform="rotate(12 65 30)"/><path d="M36 24h48l-6 70H42z" fill="#D7261E"/><rect x="33" y="18" width="54" height="9" rx="4" fill="#B81F18"/><path d="M40 48h40l-2 22H42z" fill="#FFF6E0"/><path d="M50 56q10 8 20 0" stroke="#D7261E" stroke-width="4" fill="none" stroke-linecap="round"/>`);
    case "lemon": return S(`<path d="M38 18h44l-6 76H44z" fill="#FFF2B0" opacity=".9"/><path d="M40 40h40l-4 54H44z" fill="#F5D94A"/><circle cx="82" cy="22" r="13" fill="#9BD34A"/><circle cx="82" cy="22" r="9" fill="#DDF29B"/><path d="M50 52l6 6m8-12 4 8m-14 18 6 4" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>`);
    case "water": return S(`<rect x="50" y="6" width="20" height="10" rx="3" fill="#2F7FD8"/><path d="M46 18h28v10q8 6 8 16v42a8 8 0 0 1-8 8H46a8 8 0 0 1-8-8V44q0-10 8-16z" fill="#BFE3FF"/><rect x="38" y="52" width="44" height="18" fill="#2F7FD8"/>`);
    case "sundae": return S(`<path d="M30 48q30-40 60 0z" fill="#FFF3DF"/><path d="M34 44q8-10 16 0t16 0 16 0 6 0" stroke="#8B4A1E" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="62" cy="14" r="7" fill="#D7261E"/><path d="M26 48h68l-12 22H38z" fill="#F2D9A6"/><rect x="54" y="70" width="12" height="16" fill="#F2D9A6"/><rect x="40" y="86" width="40" height="7" rx="3" fill="#E5C78A"/>`);
    case "brownie": return S(`<path d="M20 50l40-16 42 16v26l-42 16-40-16z" fill="#5A2E17"/><path d="M20 50l40-16 42 16-42 16z" fill="#7A4124"/><path d="M28 50q8-4 14 1t14-1 14 1 14-1 10 0" stroke="#3E1F0F" stroke-width="3" fill="none"/>`);
    case "combo": return S(`<g transform="translate(-14 14) scale(.78)">${lettuce(50)+bunTop+cheese(56)+patty(60)+bunBot(74)}</g><g transform="translate(60 4) scale(.62)"><path d="M36 24h48l-6 70H42z" fill="#D7261E"/><rect x="33" y="18" width="54" height="9" rx="4" fill="#B81F18"/></g><g transform="translate(46 30) scale(.55)"><g fill="#FFC93A">${[40,50,60,70,80].map(x=>`<rect x="${x}" y="14" width="7" height="44" rx="2"/>`).join("")}</g><path d="M30 44h68l-8 50H38z" fill="#FFC21A" stroke="#221A14" stroke-width="2"/></g>`);
    case "kids": return S(`<rect x="16" y="34" width="88" height="56" rx="8" fill="#FFC21A"/><path d="M36 34q0-26 24-26t24 26" stroke="#D7261E" stroke-width="7" fill="none"/><circle cx="46" cy="58" r="5" fill="#221A14"/><circle cx="74" cy="58" r="5" fill="#221A14"/><path d="M46 72q14 10 28 0" stroke="#221A14" stroke-width="4" fill="none" stroke-linecap="round"/>`);
  }
}

  const q=query.trim().toLowerCase();
  const list=q?P.filter(p=>(p.n+" "+p.d).toLowerCase().includes(q)):P.filter(p=>p.c===cat);
  $("#secTitle").firstChild.textContent=q?"Resultados ":CATS.find(c=>c.id===cat).n+" ";
  $("#secCount").textContent=list.length+(list.length===1?" opción":" opciones");
  $("#grid").innerHTML=list.length?list.map(p=>`
    <button class="card" data-id="${p.id}" aria-label="${p.n}, ${money(p.p)}">
      <div class="pic"><img src="${IMG[p.id]}" alt="" loading="lazy"></div>
      ${p.b?`<span class="badge">${p.b}</span>`:""}
      <span class="name">${p.n}</span>
      <span class="row"><span class="price">${money(p.p)}</span><span class="plus" aria-hidden="true">+</span></span>
    </button>`).join(""):`<p class="empty">No encontramos “${query}”. Probá con otra palabra.</p>`;
}

/* ---------- detalle ---------- */
let sel;
function openDetail(id){
  const p=P.find(x=>x.id===id);
  sel={p,size:0,add:new Set(),qty:1,note:""};
  drawDetail(); $("#detail").hidden=false;
}
function unit(){const s=sel.p.s?SIZES[sel.p.s][sel.size].p:0;const a=[...sel.add].reduce((t,i)=>t+ADDONS[sel.p.x][i].p,0);return sel.p.p+s+a}
function drawDetail(){
  const p=sel.p;
  $("#detail").innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${p.n}">
    <div class="grab"></div>
    <div class="d-pic"><img src="${IMG[p.id]}" alt="${p.n}"><button class="close" data-close aria-label="Cerrar">×</button></div>
    <div class="d-title">${p.n}</div>
    <p class="d-desc">${p.d}</p>
    ${p.k?`<span class="kcal">${p.k} kcal aprox.</span>`:""}
    ${p.s?`<div class="group"><h3>Tamaño</h3><div class="opts" role="radiogroup">${SIZES[p.s].map((o,i)=>`<button class="opt" role="radio" aria-checked="${i===sel.size}" data-size="${i}"><span class="l"><span class="dot"></span>${o.n}</span><span class="p">${o.p?"+ "+money(o.p):"Incluido"}</span></button>`).join("")}</div></div>`:""}
    ${p.x?`<div class="group"><h3>Agregados</h3><div class="opts">${ADDONS[p.x].map((o,i)=>`<button class="opt" role="checkbox" aria-checked="${sel.add.has(i)}" data-add="${i}"><span class="l"><span class="dot"></span>${o.n}</span><span class="p">${o.p?"+ "+money(o.p):"Gratis"}</span></button>`).join("")}</div></div>`:""}
    <div class="group"><h3>Aclaraciones</h3><textarea id="note" rows="2" placeholder="Ej.: punto de la carne, sin sal…">${sel.note}</textarea></div>
    <div class="foot">
      <div class="qty"><button data-q="-1" aria-label="Menos">−</button><span>${sel.qty}</span><button data-q="1" aria-label="Más">+</button></div>
      <button class="cta" id="addBtn"><span>Agregar</span><b>${money(unit()*sel.qty)}</b></button>
    </div></div>`;
}
$("#detail").addEventListener("click",e=>{
  const t=e.target.closest("button");
  if(e.target===$("#detail")||t?.dataset.close!==undefined&&t){ $("#detail").hidden=true; return; }
  if(!t) return;
  sel.note=$("#note")?.value||"";
  if(t.dataset.size) sel.size=+t.dataset.size;
  else if(t.dataset.add){const i=+t.dataset.add; sel.add.has(i)?sel.add.delete(i):sel.add.add(i)}
  else if(t.dataset.q) sel.qty=Math.max(1,sel.qty+ +t.dataset.q);
  else if(t.id==="addBtn"){ addToCart(); return; }
  drawDetail();
});
function addToCart(){
  const p=sel.p, opts=[];
  if(p.s) opts.push(SIZES[p.s][sel.size].n);
  [...sel.add].sort().forEach(i=>opts.push(ADDONS[p.x][i].n));
  const note=$("#note").value.trim();
  const key=p.id+"|"+opts.join(",")+"|"+note;
  const ex=cart.find(l=>l.key===key);
  ex?ex.qty+=sel.qty:cart.push({key,p,opts,note,unit:unit(),qty:sel.qty});
  $("#detail").hidden=true; toast(`${p.n} agregado`); renderBar();
}

/* ---------- carrito ---------- */
const sub=()=>cart.reduce((t,l)=>t+l.unit*l.qty,0);
const total=()=>sub()+(mode==="delivery"&&cart.length?DELIVERY:0);
function renderBar(){
  const n=cart.reduce((t,l)=>t+l.qty,0);
  $("#cartbar").hidden=!n; $("#cCount").textContent=n; $("#cTot").textContent=money(sub());
}
function message(){
  const name=$("#cName")?.value.trim(), addr=$("#cAddr")?.value.trim();
  let m="¡Hola Brasa! Quiero hacer este pedido:\n\n";
  cart.forEach(l=>{m+=`• ${l.qty}x ${l.p.n}${l.opts.length?" ("+l.opts.join(", ")+")":""} — ${money(l.unit*l.qty)}\n`; if(l.note) m+=`   Nota: ${l.note}\n`;});
  m+=`\nSubtotal: ${money(sub())}`;
  if(mode==="delivery") m+=`\nEnvío: ${money(DELIVERY)}`;
  m+=`\n*Total: ${money(total())}*\n\n`;
  m+=mode==="delivery"?`Entrega: delivery a ${addr||"(completar dirección)"}`:"Entrega: retiro en el local";
  m+=`\nNombre: ${name||"(completar)"}`;
  return m;
}
function drawCart(keep){
  const name=$("#cName")?.value||"", addr=$("#cAddr")?.value||"";
  if(!cart.length){ $("#cart").hidden=true; return; }
  $("#cart").innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Tu pedido">
    <div class="grab"></div>
    <div class="c-title">Tu pedido</div>
    ${cart.map((l,i)=>`<div class="line"><div class="mini"><img src="${IMG[l.p.id]}" alt=""></div>
      <div class="n">${l.p.n}<small>${[...l.opts,l.note&&"“"+l.note+"”"].filter(Boolean).join(" · ")||"Sin cambios"}</small></div>
      <div class="r"><b>${money(l.unit*l.qty)}</b><div class="qty"><button data-l="${i}" data-d="-1" aria-label="Quitar uno">−</button><span>${l.qty}</span><button data-l="${i}" data-d="1" aria-label="Sumar uno">+</button></div></div></div>`).join("")}
    <div class="group"><h3>¿Cómo lo recibís?</h3>
      <div class="seg"><button data-m="delivery" aria-pressed="${mode==="delivery"}">Delivery</button><button data-m="pickup" aria-pressed="${mode==="pickup"}">Retiro en local</button></div>
      <div class="field"><label for="cName">Tu nombre</label><input id="cName" value="${name.replace(/"/g,"&quot;")}" placeholder="Ej.: Ángeles"></div>
      ${mode==="delivery"?`<div class="field"><label for="cAddr">Dirección</label><input id="cAddr" value="${addr.replace(/"/g,"&quot;")}" placeholder="Calle, número, entre calles"></div>`:""}
    </div>
    <div class="sum"><div><span>Subtotal</span><span>${money(sub())}</span></div>
      ${mode==="delivery"?`<div><span>Envío</span><span>${money(DELIVERY)}</span></div>`:""}
      <div class="t"><span>Total</span><span>${money(total())}</span></div></div>
    <div class="preview" id="prev"></div>
    <div class="foot"><a class="cta wa" id="waBtn" target="_blank" rel="noopener" style="text-decoration:none"><span>Pedir por WhatsApp</span><b>${money(total())}</b></a></div>
    <button class="ghost" id="copyBtn">Copiar mensaje del pedido</button>
    <p class="note">Se abre WhatsApp con el mensaje listo para enviar al local.</p>
  </div>`;
  updatePreview();
}
function updatePreview(){
  const m=message(); $("#prev").textContent=m;
  $("#waBtn").href=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(m)}`;
}
$("#cart").addEventListener("input",updatePreview);
$("#cart").addEventListener("click",e=>{
  if(e.target===$("#cart")){ $("#cart").hidden=true; return; }
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.l){const l=cart[+t.dataset.l]; l.qty+=+t.dataset.d; if(l.qty<1) cart.splice(+t.dataset.l,1); renderBar(); drawCart();}
  else if(t.dataset.m){mode=t.dataset.m; drawCart();}
  else if(t.id==="copyBtn"){
    const m=message();
    navigator.clipboard?.writeText(m).then(()=>toast("Mensaje copiado")).catch(()=>{const r=document.createRange();r.selectNodeContents($("#prev"));getSelection().removeAllRanges();getSelection().addRange(r);toast("Seleccionado: copialo a mano")});
  }
});

/* ---------- eventos generales ---------- */
let tt;
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1600)}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;query="";$("#q").value="";renderChips();renderGrid()});
$("#grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openDetail(c.dataset.id)});
$("#q").addEventListener("input",e=>{query=e.target.value;renderChips();renderGrid()});
$("#heroBtn").addEventListener("click",()=>openDetail("cbrasa"));
$("#openCart").addEventListener("click",()=>{$("#cart").hidden=false;drawCart()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#detail").hidden=true;$("#cart").hidden=true}});


/* pedido de ejemplo para que la demo arranque mostrando el carrito */
cart.push({key:"clasica|Simple,Bacon|",p:P[0],opts:["Simple","Bacon"],note:"",unit:10100,qty:1});
renderChips(); renderGrid(); renderBar();
</script>

</body></html>
